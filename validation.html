<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreetRush · Vehicle Lab</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#0d1014; color:#eef1f3; }
    body { margin:0; padding:32px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(28px,5vw,62px); letter-spacing:-.04em; }
    p { color:#9da7ae; margin:.5rem 0 0; }
    a { color:#dfff00; }
    table { width:100%; border-collapse:collapse; background:#151a20; }
    th,td { padding:13px 12px; border-bottom:1px solid #2a3139; text-align:right; font-variant-numeric:tabular-nums; }
    th:first-child,td:first-child { text-align:left; }
    th { color:#8d98a1; font-size:12px; letter-spacing:.08em; }
    .pass { color:#dfff00; font-weight:800; }
    .fail { color:#ff5a54; font-weight:800; }
    #summary { margin-top:18px; font-weight:700; }
  </style>
</head>
<body>
  <header><div><h1>VEHICLE LAB</h1><p>六车自动落地、起步、左右转向、刹停、倒车与恢复前进验证</p></div><a href="/">返回游戏</a></header>
  <table>
    <thead><tr><th>车辆</th><th>落地跳动</th><th>起步抬升</th><th>前进</th><th>左转</th><th>右转</th><th>倒车</th><th>恢复前进</th><th>结果</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <div id="summary">正在建立平整试车场…</div>
  <div id="input-result"></div>
  <script type="module" src="/src/validation.js"></script>
</body>
</html>
