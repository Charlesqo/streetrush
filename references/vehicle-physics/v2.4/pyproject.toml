[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-calibration-reference"
version = "2.4.0"
description = "Transactional reduced-planar vehicle physics reference with final cross-system close-out evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<2.4",
  "scipy>=1.15,<1.18",
]

[project.optional-dependencies]
validation = ["pytest>=8,<10"]

[project.scripts]
vehicle-physics-v2-4-validate = "engine_calibration_reference.run_v2_4_validation:main"
vehicle-physics-v2-4-maneuvers = "engine_calibration_reference.run_v2_4_maneuver_matrix:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine_calibration_reference*"]

[tool.setuptools.package-data]
engine_calibration_reference = [
  "data/synthetic_engine_asset.json",
  "data/raw/synthetic_engine_map_v2_0.csv",
  "data/raw/synthetic_engine_map_v2_0.metadata.json",
  "data/maneuver_matrix_v2_4.json",
  "data/validation_manifest_v2_4.json",
]
