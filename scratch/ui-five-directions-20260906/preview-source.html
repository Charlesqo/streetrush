  {id:'shift',name:'街头竞速',title:'SHIFT / 02',desc:'主菜单横向展开，选车采用斜切标签，HUD 计时移到右侧。Archivo Black 粗黑斜体、酸橙与紫色、错位投影；动感鲜明，驾驶时收敛装饰。'},
  {id:'heritage',name:'经典车会',title:'CLUB / 03',desc:'奶油色参赛车卡搭配横排车库，HUD 使用圆形仪表。Bodoni Moda 与宋体标题、赛车绿与黄铜、细双线；适合经典车型，关键计时使用清晰的窄体数字。'},

 ];

 const footer=()=>`<footer class="sr-game-footer"><span><kbd>W A S D</kbd>驾驶 &nbsp; <kbd>空格</kbd>手刹</span><span><kbd>← →</kbd>选车 &nbsp; <kbd>Enter</kbd>发车 &nbsp; <kbd>Esc</kbd>返回</span></footer>`;

 function garage(c){return `${header()}<div class="sr-garage-heading"><div class="sr-car-index">${String(state.car+1).padStart(2,'0')} / 06</div><h1>${c.name}</h1><div class="sr-car-type">${c.drive} &nbsp; · &nbsp; 已就绪</div></div><div class="sr-car-stats">${[['极速',c.speed,'km/h',c.speed/350*100],['加速',c.accel,'/ 100',c.accel],['操控',c.grip,'/ 100',c.grip]].map(([label,value,unit,pct])=>`<div><div class="sr-stat-top"><span>${label}</span><span><b>${value}</b> <small>${unit}</small></span></div><div class="sr-stat-meter"><i style="width:${pct}%"></i></div></div>`).join('')}</div><div class="sr-medals"><span>三圈奖牌目标</span><div class="sr-medal-row">${c.medals.map((m,i)=>`<span><i></i>${['金','银','铜'][i]} <b>${m}</b></span>`).join('')}</div></div><div class="sr-records"><div>最佳单圈<strong>${state.car===0?'02:20.164':'--:--.---'}</strong></div><div>三圈最佳<strong>${state.car===0?'07:08.620':'--:--.---'}</strong></div></div><div class="sr-car-arrows"><button data-act="prev" aria-label="上一辆车">←</button><button data-act="next" aria-label="下一辆车">→</button></div><nav class="sr-car-strip" aria-label="车辆">${cars.map((c,i)=>`<button class="sr-car-option" aria-pressed="${state.car===i}" data-car="${i}"><small>${c.make}</small>${c.short}</button>`).join('')}</nav><div class="sr-garage-confirm">${action('确认并发车','ENTER','start',true)}</div>${footer()}`;}
 function timing(){return `<div class="sr-timing"><div class="sr-timing-row"><div class="sr-timing-label"><span>本圈计时</span><span class="sr-valid">有效</span></div><div class="sr-timing-value"><strong>01:06.318</strong><span class="sr-delta">−0.418</span></div></div><div class="sr-timing-row"><div class="sr-timing-label"><span>分段 2 / 3</span><span>对比最佳</span></div><div class="sr-timing-value"><strong>00:22.154</strong><span class="sr-delta">−0.284</span></div></div><div class="sr-timing-row"><div class="sr-timing-label"><span>最佳单圈</span><span>本机</span></div><div class="sr-timing-value"><strong>02:20.164</strong></div></div></div>`;}
 function driveUnit(){return `<div class="sr-drive-unit"><div class="sr-rpm-label"><span>转速</span><b>5,420 RPM</b></div><div class="sr-revs" aria-label="转速 5420">${Array.from({length:16},(_,i)=>`<i class="${i<12?'on':i>13?'limit':''}"></i>`).join('')}</div><div class="sr-speed-row"><div class="sr-speed"><strong>118</strong><small>km/h</small></div><div class="sr-gear"><strong>4</strong><small>${state.mode} ${state.mode==='AT'?'自动':'手动'}</small></div></div><div class="sr-pedals"><div class="sr-pedal"><span>油门</span><i><b></b></i></div><div class="sr-pedal"><span>刹车</span><i><b></b></i></div></div></div>`;}
 function hud(){return `<div class="sr-hud-progress"><div class="sr-lap"><small>圈数</small><strong>2<span> / 3</span></strong></div><div class="sr-total"><small>总用时</small><strong>03:26.482</strong></div></div><div class="sr-hud-menu"><button data-act="pause">暂停 <b>Ⅱ</b></button><button data-act="settings">设置</button></div><div class="sr-checkpoints"><div class="sr-cp-top"><span>检查点</span><b>6 / 10</b></div><div class="sr-cp-track">${Array.from({length:10},(_,i)=>`<i class="${i<6?'passed':''}"></i>`).join('')}</div></div>${timing()}<div class="sr-goal"><small>下一目标 · 金牌</small><strong>06:45</strong><span class="sr-delta">预计 −17.846</span></div>${driveUnit()}<div class="sr-state"><span><b>柏油</b></span><span>接地 <b>4 / 4</b></span><span>辅助 <b>就绪</b></span></div><div class="sr-hud-keys"><kbd>C</kbd> 自动 / 手动 &nbsp; <kbd>Q / E</kbd> 换挡 &nbsp; <kbd>R</kbd> 重置</div>`;}
 function modal(){if(!state.modal)return '';return `<div class="sr-modal-shade"><section class="sr-modal" role="dialog" aria-modal="true" aria-label="${state.modal==='pause'?'已暂停':'驾驶设置'}"><h2>${state.modal==='pause'?'已暂停':'驾驶设置'}</h2>${state.modal==='pause'?`${action('继续驾驶','ESC','close',true)}${action('重新开始','RESTART','restart')}${action('返回主菜单','MENU','menu')}`:`<div class="sr-settings-row"><span>驾驶</span><b>WASD / 方向键</b></div><div class="sr-settings-row"><span>手刹</span><b>空格</b></div><div class="sr-settings-row"><span>换挡</span><b>C 自动 / 手动 · Q / E</b></div>${action('声音 · '+(state.sound?'开':'关'),'SOUND','sound')}${action('变速箱 · '+(state.mode==='AT'?'自动':'手动'),'GEAR','mode')}${action('返回','ESC','close',true)}`}</section></div>`;}
 function hudForCar(c){
  const targets=c.medals.map(v=>{const [m,s]=v.split(':').map(Number);return (m*60+s)*1000;});
  const projected=206482/16*30;
  const index=projected>targets[2]?2:projected>targets[1]?1:0;
  const delta=projected-targets[index];
  let content=hud().replace('下一目标 · 金牌','下一目标 · '+['金牌','银牌','铜牌'][index]).replace('06:45',c.medals[index]).replace('预计 −17.846','预计 '+(delta<0?'−':'+')+(Math.abs(delta)/1000).toFixed(3));
  if(delta>0)content=content.replace('<span class="sr-delta">预计','<span class="sr-delta sr-behind">预计');
  if(state.car!==0)content=content.replace('02:20.164','--:--.---').replace('−0.418','—').replace('−0.284','—').replace('对比最佳','暂无对比');
  return content;
 }
 function frame(t,s,mini=false){const c=cars[state.car];return `<section class="sr-frame theme-${t} screen-${s}" aria-label="${themes.find(x=>x.id===t).name} · ${sceneLabel[s]}"><img class="sr-scene" src="${IMAGES[s==='hud'?(state.car===0?'drive':'drive-'+c.id):c.id]||IMAGES.drive}" alt="${s==='hud'?c.name+' 龙湾赛道追车驾驶实景':c.name+' 龙湾赛道车辆实景'}"><div class="sr-wash"></div>${s==='menu'?menu(c):s==='garage'?garage(c):hudForCar(c)}${mini?'':modal()}</section>`;}
 function render(){
  root.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===state.theme&&!state.overview)));
  root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===state.screen&&!state.overview)));
  root.querySelector('[data-overview]').setAttribute('aria-pressed',String(state.overview));
  const focus=root.querySelector('#sr-focus'),overview=root.querySelector('#sr-overview'),description=root.querySelector('#sr-description');
  focus.hidden=state.overview;overview.hidden=!state.overview;description.hidden=state.overview;
  if(state.overview){focus.innerHTML='';overview.innerHTML=themes.map(t=>`<section class="sr-overview-section"><div class="sr-overview-heading"><strong>${t.title} &nbsp; ${t.name}</strong></div><div class="sr-overview-frames">${['menu','garage','hud'].map(s=>`<figure class="sr-mini">${frame(t.id,s,true)}<figcaption><span>${sceneLabel[s]}</span><button class="btn" data-expand="${t.id}:${s}">查看</button></figcaption></figure>`).join('')}</div><div class="sr-overview-note">${t.desc}</div></section>`).join('');}
  else {overview.innerHTML='';focus.innerHTML=frame(state.theme,state.screen);description.textContent=themes.find(t=>t.id===state.theme).desc;}
 }
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.theme){state.theme=b.dataset.theme;state.overview=false;state.modal=null;}
  if(b.dataset.screen){state.screen=b.dataset.screen;state.overview=false;state.modal=null;}
  if(b.hasAttribute('data-overview')){state.overview=!state.overview;state.modal=null;}
  if(b.dataset.expand){[state.theme,state.screen]=b.dataset.expand.split(':');state.overview=false;state.modal=null;}
  if(b.dataset.car!==undefined)state.car=Number(b.dataset.car);
  const a=b.dataset.act;
  if(a==='start'||a==='restart'){state.screen='hud';state.modal=null;}
  if(a==='garage')state.screen='garage';
  if(a==='menu'){state.screen='menu';state.modal=null;}
  if(a==='prev'||a==='next')state.car=(state.car+(a==='prev'?5:1))%6;
  if(a==='settings'||a==='pause')state.modal=a;
  if(a==='close')state.modal=null;
  if(a==='sound')state.sound=!state.sound;
  if(a==='mode')state.mode=state.mode==='AT'?'MT':'AT';
  render();
  if(state.modal){const frame=root.querySelector('#sr-focus .sr-frame');[...frame.children].filter(el=>!el.classList.contains('sr-modal-shade')).forEach(el=>el.inert=true);root.querySelector('.sr-modal button')?.focus();}
  else if(a){const selector=a==='start'||a==='restart'||a==='close'&&state.screen==='hud'?'[data-act="pause"]':a==='garage'?'[data-car="'+state.car+'"]':'[data-act="'+a+'"]';root.querySelector('#sr-focus '+selector)?.focus();}
  else if(b.dataset.car!==undefined)root.querySelector('#sr-focus [data-car="'+state.car+'"]')?.focus();
 });
 root.addEventListener('keydown',e=>{
  if(e.key==='Tab'&&state.modal){const buttons=[...root.querySelectorAll('.sr-modal button')],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}
  if(e.key==='Escape'){state.modal?state.modal=null:state.screen==='hud'?state.modal='pause':state.screen='menu';e.preventDefault();render();}
  if(!state.modal&&!state.overview&&state.screen==='garage'&&['ArrowLeft','ArrowRight'].includes(e.key)){state.car=(state.car+(e.key==='ArrowLeft'?5:1))%6;e.preventDefault();render();root.querySelector('#sr-focus [data-car="'+state.car+'"]')?.focus();}
  if(!state.modal&&!state.overview&&state.screen==='garage'&&e.key==='Enter'&&e.target.hasAttribute('data-car')){state.screen='hud';e.preventDefault();render();root.querySelector('#sr-focus [data-act="pause"]')?.focus();}
  if(!state.modal&&!state.overview&&state.screen==='hud'&&e.key.toLowerCase()==='c'){state.mode=state.mode==='AT'?'MT':'AT';e.preventDefault();render();}
 });
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'theme',{label:'界面方案',options:themes.map(t=>({label:t.name,value:t.id}))});tweak.addSelect(state,'screen',{label:'游戏画面',options:[{label:'主菜单',value:'menu'},{label:'选车',value:'garage'},{label:'驾驶 HUD',value:'hud'}]});}
})();
</script>
