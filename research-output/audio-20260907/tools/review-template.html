<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreetRush · 声音资料室</title>
<style>
:root{color-scheme:dark;--bg:#0c1014;--card:#151b21;--line:#2b343e;--muted:#a2b0bb;--mint:#adf2c2;--amber:#ffca8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e7edf2;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--mint);text-underline-offset:3px}button,input,select{font:inherit}button,select{cursor:pointer;border:1px solid var(--line);border-radius:7px;color:inherit;background:#1b242d;padding:7px 13px}button:hover{border-color:var(--mint)}button.active{background:var(--mint);color:#0c2012}main{max-width:1280px;margin:auto;padding:42px 26px 90px}header{display:grid;grid-template-columns:1.7fr 1fr;gap:45px;padding-bottom:30px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--mint);letter-spacing:.18em;font:12px monospace}h1{font-size:38px;letter-spacing:-.04em;line-height:1.2;margin:13px 0}h2{font-size:23px;margin:0 0 12px}h3{font-size:18px;line-height:1.4;margin:8px 0 12px}p{margin:8px 0}.muted,small{color:var(--muted)}.note{color:var(--amber);border-left:2px solid var(--amber);padding:6px 15px}.metrics{display:flex;gap:25px;margin:22px 0 8px}.metric b{display:block;font:32px/1.1 monospace}.metric span{font-size:12px;color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center}input[type=search]{background:#111920;border:1px solid var(--line);padding:9px 13px;border-radius:7px;color:#fff;min-width:270px;flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:21px;min-width:0}.tag{font:11px monospace;display:inline-block;padding:4px 8px;border:1px solid #3a4651;border-radius:4px;margin:0 6px 6px 0;color:var(--muted);max-width:100%;overflow-wrap:anywhere}.tag.amber{color:var(--amber);border-color:#725135}.tag.green{color:var(--mint);border-color:#436450}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.links{font-size:13px;margin-top:16px;display:flex;gap:15px;flex-wrap:wrap}audio{width:100%;height:34px;margin-top:7px}details{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}summary{cursor:pointer;color:var(--muted)}.kv{display:grid;grid-template-columns:85px 1fr;gap:7px 12px;margin:10px 0;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.rating{margin-top:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rating input{min-width:0;flex:1;background:#0c1218;border:1px solid var(--line);padding:8px;color:inherit;border-radius:5px}.empty{padding:50px;text-align:center;border:1px solid var(--line);border-radius:12px}.full{grid-column:1/-1}.ref{border-left:3px solid #487e59}.rule{border-left:3px solid #b88d5f}.toc{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0}.footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.cue{font-size:12px;display:block;margin:7px 0}.wide{grid-column:1/-1}code{overflow-wrap:anywhere;color:var(--amber)}@media(max-width:800px){header,.grid{grid-template-columns:1fr}main{padding:25px 17px}h1{font-size:31px}.metrics{gap:19px}.toolbar>*{max-width:100%}}
</style>
<main>
<header><div><div class="eyebrow">STREETRUSH / AUDIO RESEARCH / 07 SEP 2026</div><h1>声音资料室</h1><p class="muted">六车身份、真实声音参照与独立素材候选。<br>原始资源留存 · 可追溯许可 · 本轮未接入游戏</p><div class="metrics" id="metrics"></div></div><div><p class="note">所有听感均待验证。这里可以播放本地候选、比较原始与技术预览；不把能解码写成已试听，不把相近引擎写成准确车型。</p><div class="toc"><a href="README.zh-CN.md">交付说明</a><a href="reports/MANUAL_ACQUISITION.zh-CN.md">手动获取 / 采购</a><a href="reports/QUALITY_AND_GAPS.zh-CN.md">品质参照 / 缺口</a><a href="shared/REPORT.zh-CN.md">共用素材报告</a></div><button id="export">导出我的试听记录</button> <button id="stop">停止播放</button><small id="storage"></small></div></header>
<nav id="tabs"></nav><div class="toolbar"><input id="search" type="search" placeholder="搜索车型、材质、用途或许可" aria-label="搜索素材"><select id="category" aria-label="类别"><option value="">全部类别</option></select><span id="count" class="muted"></span></div>
<div id="content" class="grid"></div><div class="footer">本页不自动播放或加载远程播放器；参考链接复用同一个参考窗口。试听记录仅保存在当前浏览器。资料台账、文件哈希和预览区间保存在目录内；不受本地评分影响。<br>除明确来源章节外，视频建议窗口均未完成声音事件定位。</div>
</main>
<script>
const DATA=__DATA__;
const E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const $=s=>document.querySelector(s);const labels={shared:'首选本地素材',vehicles:'六辆车',references:'关键参照',manual:'手动获取',gaps:'缺口与边界',parked:'未入选原件'};
let tab='shared', notes={};try{notes=JSON.parse(localStorage.getItem('streetrush-audio-review-20260907')||'{}')}catch{}
const time=s=>s==null?'待定位':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const link=(url,label)=>url?`<a href="${E(url)}" ${/^https?:/.test(url)?'target="streetrush-audio-reference" rel="noopener"':''}>${E(label)}</a>`:'';
function rating(id){const n=notes[id]||{};return `<div class="rating"><select aria-label="${E(id)} 试听判断" data-id="${E(id)}" data-field="decision">${['待试听','采用候选','拒绝','待确认'].map(s=>`<option ${n.decision===s?'selected':''}>${s}</option>`).join('')}</select><input aria-label="${E(id)} 试听备注" data-id="${E(id)}" data-field="comment" placeholder="听后记录一个原因" value="${E(n.comment||'')}"></div>`}
function audio(path,label){return path?`<small>${E(label)}</small><audio controls preload="none" src="${E(path)}"></audio>`:''}
function sharedCard(x){return `<article class="card"><span class="tag">${E(x.category)}</span><span class="tag ${x.local_path?'green':'amber'}">${x.local_path?'文件已保存':'仅链接'}</span><span class="tag">${E(x.license)}</span><h3>${E(x.title)}</h3><p>${E(x.recommended_use)}</p><p class="muted">${E(x.limitations)}</p>${x.technical_warning?`<p class="note">${E(x.technical_warning)}</p>`:''}${audio(x.preview_path,'技术预览 · 听感未验')}${!x.preview_path?audio(x.local_path,'本地原始/来源文件 · 听感未验'):''}<details><summary>原始资源、许可与时间区间</summary>${x.preview_path?audio(x.local_path,'原始 / 来源文件'):''}<dl class="kv"><dt>作者</dt><dd>${E(x.creator)}</dd><dt>区间</dt><dd>${time(x.source_start_s)} — ${time(x.source_end_s)}（原始文件时间）</dd><dt>获取状态</dt><dd>${E(x.acquisition_status)}</dd><dt>证据</dt><dd>${E(x.listening_status)}</dd></dl><div class="links">${link(x.source_url,'来源条目')}${link(x.license_url,'许可')}${link(x.local_path,'文件')}${link(x.original_path,'原始资源')}</div></details>${rating(x.id)}</article>`}
function vehicleCard(x){return `<article class="card"><span class="tag">${E(x.id)}</span><span class="tag amber">${E(x.identity_status)}</span><h3>${E(x.name)}</h3><p>${E(x.target)}</p><p class="muted">${E(x.engine)} / ${E(x.transmission)}</p><p class="note">${E(x.priority)}</p><details><summary>驾驶状态与录音位置</summary><dl class="kv">${Object.entries(x.states).map(([k,v])=>`<dt>${E({start_idle:'启动/怠速',load:'负载',lift_shift:'收油/传动',intake_boost:'进气/增压',perspectives:'机位'}[k])}</dt><dd>${E(v)}</dd>`).join('')}</dl><p class="muted">${E(x.sound_hypothesis)}</p><p>不可混用：${E(x.must_not_use.join('；'))}</p></details><div class="links">${link(`vehicles/${x.id}.zh-CN.md`,'完整档案')}${DATA.references.filter(r=>r.vehicle_id===x.id).slice(0,2).map(r=>link(r.url,r.id+' 参考')).join('')}</div></article>`}
function referenceCard(x){return `<article class="card ref"><span class="tag">${E(x.vehicle_id)}</span><span class="tag amber">${x.local_path?'CC BY 4.0预览 · 车型未定':'参考 · 未获游戏复用权'}</span><h3>${E(x.title)}</h3><small>${E(x.creator)} / ${E(x.verification)}</small><p>${E(x.recommended_use)}</p><p class="muted">车型范围：${E(x.match)}</p>${audio(x.local_path,'已存公开HQ转码预览 · 非原始320kbps文件')}${x.cues.map(c=>{let u=x.url;if(u.includes('youtube.com/watch'))u+='&t='+c.start_s;return `<div class="cue">${link(u,time(c.start_s)+(c.end_s!=null?'–'+time(c.end_s):'')+' · '+c.label)}<br><span class="muted">${c.timestamp_status.includes('PUBLISHER_CHAPTER')?'作者章节已核实；未试听':'建议窗口 / 待定位；不是已确认声音事件'}</span></div>`}).join('')}<div class="links">${link(x.url,'打开原站参照')}${link(x.license_url,'许可')}</div>${rating(x.id)}</article>`}
function manualCard(x){return `<article class="card rule"><span class="tag amber">${E(x.priority)} · 手动获取</span><h3>${E(x.title)}</h3><p>${E(x.price)}</p><p>${E(x.use)}</p><p class="muted">${E(x.gap)}</p><p class="muted">未取得文件：质量待验证。</p><div class="links">${link(x.url,'具体商品页')}${link('reports/MANUAL_ACQUISITION.zh-CN.md','推荐依据与获取步骤')}</div></article>`}
function render(){document.querySelectorAll('audio').forEach(a=>a.pause());const q=$('#search').value.toLowerCase(),cat=$('#category').value;let xs=DATA[tab]||[];xs=xs.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!cat||(x.category||x.vehicle_id||x.id)===cat));$('#count').textContent=xs.length+' 条';const f={shared:sharedCard,parked:sharedCard,vehicles:vehicleCard,references:referenceCard,manual:manualCard,gaps:x=>`<article class="card"><h3>${E(x.title)}</h3><p>${E(x.body)}</p></article>`}[tab];let intro='';if(tab==='shared'&&!q&&!cat)intro=`<article class="card full"><span class="tag green">派生预览</span><h3>素材走查 · 第二版</h3><p class="muted">真实收集文件按顺序编排，间隔1秒。以下时间是编排时点，已知来源区间；不是声音听感验收或游戏混音。</p><audio id="reel" controls preload="none" src="previews/shared-review-v2.wav"></audio><div class="row">${DATA.cues.map(c=>`<button data-cue="${c.reel_start_s}">${time(c.reel_start_s)} ${E(c.title)}</button>`).join('')}</div><div class="links">${link('previews/shared-review-v2.cues.json','完整来源与时间表')}${link('reports/preview-processing.json','处理参数')}</div></article>`;if(tab==='parked')intro='<p class="note full">以下原件未删除，但已从本轮首选排除。不要将通用发动机、室内掌声或不匹配的喊声直接用于目标车辆/赛道。</p>';$('#content').innerHTML=intro+(xs.length?xs.map(f).join(''):'<div class="empty full">没有匹配项。可切换分类或清空搜索。</div>')}
function choose(t){document.querySelectorAll('audio').forEach(a=>a.pause());tab=t;$('#tabs').innerHTML=Object.entries(labels).map(([k,v])=>`<button data-tab="${k}" class="${k===tab?'active':''}">${v}</button>`).join('');let cats=[...new Set((DATA[tab]||[]).map(x=>x.category||x.vehicle_id||x.id).filter(Boolean))];$('#category').innerHTML='<option value="">全部类别</option>'+cats.map(x=>`<option>${E(x)}</option>`).join('');$('#category').hidden=['manual','gaps'].includes(tab);render()}
$('#metrics').innerHTML=`<div class="metric"><b>06</b><span>现有车辆档案</span></div><div class="metric"><b>${DATA.shared.filter(x=>x.local_path).length}</b><span>已存本地候选</span></div><div class="metric"><b>${DATA.references.length}</b><span>关键参照</span></div><div class="metric"><b>0</b><span>主观试听通过</span></div>`;
$('#tabs').addEventListener('click',e=>{if(e.target.dataset.tab)choose(e.target.dataset.tab)});$('#search').addEventListener('input',render);$('#category').addEventListener('change',render);
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
$('#stop').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());
$('#content').addEventListener('click',e=>{if(e.target.dataset.cue!=null){const a=$('#reel');a.currentTime=Number(e.target.dataset.cue);a.play().catch(()=>{})}});
$('#content').addEventListener('change',e=>{const {id,field}=e.target.dataset;if(!id)return;notes[id]={...(notes[id]||{}),[field]:e.target.value,updated_at:new Date().toISOString()};try{localStorage.setItem('streetrush-audio-review-20260907',JSON.stringify(notes));$('#storage').textContent=' 已保存到此浏览器'}catch{$('#storage').textContent=' 无法本地保存，请导出记录'}});
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({date:new Date().toISOString(),notes},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='streetrush-listening-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};choose('shared');
</script></html>
